name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # macos-15 topped out at Xcode 26.3 and iOS 26.2 simulators, so CI
      # validated a compiler three minor versions behind the one releases are
      # built with. macos-26 carries Xcode 26.6 and an iOS 26.5 runtime with
      # iPhone 17 Pro — the same pair used locally.
      - name: Select Xcode
        run: |
          for V in 26.6 26.5 26.4.1; do
            if [ -d "/Applications/Xcode_$V.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$V.app/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo "::error::None of Xcode 26.6, 26.5 or 26.4.1 found on runner"; exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Keyed on project.yml, not Package.resolved: that file is gitignored
      # (.gitignore excludes project.xcworkspace/) and is written by the
      # resolve step below, so hashing it here always yielded an empty hash —
      # a constant key that hit on every run and therefore never re-saved,
      # freezing the cache on whatever the first run downloaded. project.yml
      # is tracked, present at checkout, and is where the version
      # requirements actually live. restore-keys lets a new key start from
      # the previous cache instead of from nothing.
      - name: Cache SPM packages
        uses: actions/cache@v5
        with:
          path: SourcePackages
          key: spm-${{ hashFiles('project.yml') }}
          restore-keys: spm-

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Trakke.xcodeproj -scheme Trakke -clonedSourcePackagesDirPath SourcePackages

      - name: Find available simulator
        id: simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in sorted(data['devices'].items(), reverse=True):
              if 'iOS-26' in runtime or 'iOS 26' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(d['name'])
                          sys.exit(0)
          # Fallback: any available iPhone
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(d['name'])
                          sys.exit(0)
          # No guessed device name: a bogus fallback hides the real cause
          # behind a misleading 'No devices matching' error.
          sys.stderr.write('ERROR: no available iPhone simulator on this runner\n')
          sys.exit(1)
          ")
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"

      - name: Run tests
        run: |
          xcodebuild \
            -project Trakke.xcodeproj \
            -scheme Trakke \
            -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}' \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath SourcePackages \
            -testLanguage nb \
            -testRegion NO \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            test

      - name: Build Release
        run: |
          xcodebuild \
            -project Trakke.xcodeproj \
            -scheme Trakke \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}' \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath SourcePackages \
            build

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults.xcresult
          retention-days: 14
